<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUROON ARCHIVE .✦</title>
  
  <!-- 레트로/키치한 폰트 불러오기 (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Zen+Dots&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. ROOT VARS & BASIC RESET
       ========================================== */
    :root {
      --bg-pink: #ECA8B9;
      --navy-dark: #1C2038;
      --navy-light: #2C3352;
      --white-oval: #FFFFFF;
      --accent-lilac: #D3C6EB;
      --font-digital: 'VT323', monospace;
      --font-title: 'Zen Dots', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-pink);
      color: var(--navy-dark);
      font-family: var(--font-digital);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      overflow-x: hidden;
      cursor: crosshair; /* 레트로 느낌의 십자 커서 */
    }

    /* ==========================================
       2. HEADER / MUSIC PLAYER UI
       ========================================== */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1.5rem;
      letter-spacing: 2px;
    }

    .top-dots {
      display: flex;
      gap: 12px;
    }

    .dot {
      width: 14px;
      height: 14px;
      background-color: var(--navy-dark);
      border-radius: 50%;
    }

    .player-center {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* 지구본 회전 애니메이션 */
    .globe-icon {
      width: 32px;
      height: 32px;
      border: 2px solid var(--navy-dark);
      border-radius: 50%;
      position: relative;
      animation: spin 8s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .globe-icon::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 12px;
      border: 2px solid var(--navy-dark);
      border-radius: 50%;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ==========================================
       3. MAIN HERO / ORBIT DESIGN (중앙 궤도)
       ========================================== */
    main {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px 0;
      position: relative;
    }

    /* 마우스 호버 시 입체적으로 기우는 컨테이너 */
    .hero-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease-out;
    }

    /* 타원 배경 */
    .oval-bg {
      background-color: var(--white-oval);
      width: 95%;
      height: 110px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 0px rgba(28, 32, 56, 0.15);
      position: relative;
      z-index: 1;
    }

    /* 메인 타이틀 */
    .main-title {
      font-family: var(--font-title);
      font-size: 3.2rem;
      color: var(--navy-dark);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
    }

    /* 타이틀 주변을 감싸는 3D 궤도 선 */
    .orbit-ring {
      position: absolute;
      width: 105%;
      height: 160px;
      border: 3px solid var(--navy-dark);
      border-radius: 50%;
      transform: rotate(-12deg);
      pointer-events: none;
      z-index: 2;
    }

    /* 궤도 위 반짝이는 별/커서 아이콘 */
    .sparkle {
      position: absolute;
      font-size: 1.8rem;
      color: var(--navy-dark);
      animation: pulse 1.5s infinite alternate;
    }

    .sparkle.top-right { top: -20px; right: 15%; }
    .sparkle.cursor-icon { bottom: -10px; right: 8%; transform: rotate(-20deg); }

    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.7; }
      to { transform: scale(1.2); opacity: 1; }
    }

    .sub-title {
      margin-top: 15px;
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    .quote-box {
      margin-top: 50px;
      text-align: center;
      position: relative;
    }

    .quote-box .heart {
      font-size: 0.9rem;
      margin: 0 6px;
    }

    .quote-text {
      font-size: 1.2rem;
      margin-top: 5px;
      opacity: 0.85;
    }

    /* ==========================================
       4. FOOTER / BARCODE & CONTROLS
       ========================================== */
    footer {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    /* 네비게이션 / 사각형 제어 버튼들 */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--navy-dark);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-icon:hover {
      transform: scale(1.2);
    }

    .pixel-box {
      width: 32px;
      height: 32px;
      background-color: var(--navy-light);
      border: 2px solid var(--navy-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--navy-dark);
    }

    .pixel-box:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px;
    }

    .pixel-box.heart-box {
      background-color: var(--white-oval);
      color: var(--navy-dark);
    }

    /* 바코드 섹션 */
    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .barcode-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* CSS로 만드는 레트로 바코드 */
    .barcode {
      display: flex;
      height: 45px;
      align-items: flex-end;
      gap: 3px;
    }

    .bar { background-color: var(--navy-dark); height: 100%; }
    .w-1 { width: 2px; }
    .w-2 { width: 5px; }
    .w-3 { width: 8px; }

    .barcode-num {
      font-size: 1.1rem;
      margin-top: 4px;
      letter-spacing: 3px;
    }

    /* 플러스 버튼 (아카이브 레이어로 이동하는 버튼) */
    .plus-btn {
      width: 45px;
      height: 45px;
      border: 2px solid var(--navy-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }

    .plus-btn:hover {
      background: var(--navy-dark);
      color: var(--bg-pink);
    }
  </style>
</head>
<body>

  <!-- 1. 상단 뮤직 플레이어 UI -->
  <header>
    <div class="top-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="player-center">
      <span>0:00</span>
      <div class="globe-icon"></div>
      <span>0:00</span>
    </div>
    <div class="top-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </header>

  <!-- 2. 중앙 메인 타이틀 & 궤도 -->
  <main>
    <div class="hero-container" id="hero">
      <div class="orbit-ring"></div>
      <div class="sparkle top-right">✦</div>
      <div class="sparkle cursor-icon">➔</div>
      
      <div class="oval-bg">
        <h1 class="main-title">. TRAVEL JOURNAL</h1>
      </div>
    </div>

    <p class="sub-title">Design for @ ruroon._.g_</p>

    <div class="quote-box">
      <p><span class="heart">♥</span> LOVERSLEPORINELADYMART <span class="heart">♥</span></p>
      <p class="quote-text">The world is a book and those who do not travel read only a page.</p>
    </div>
  </main>

  <!-- 3. 하단 컨트롤러 & 바코드 -->
  <footer>
    <div class="controls-row">
      <button class="btn-icon">☰</button>
      <button class="btn-icon">⏮</button>
      <div class="pixel-box">✕</div>
      <div class="pixel-box heart-box">♥</div>
      <div class="pixel-box">✕</div>
      <div class="pixel-box">✕</div>
      <div class="pixel-box heart-box">♥</div>
      <div class="pixel-box">✕</div>
      <div class="pixel-box">✕</div>
      <button class="btn-icon">⏭</button>
    </div>

    <div class="bottom-bar">
      <!-- 왼쪽 바코드 -->
      <div class="barcode-container">
        <div class="barcode">
          <div class="bar w-2"></div><div class="bar w-1"></div><div class="bar w-3"></div>
          <div class="bar w-1"></div><div class="bar w-2"></div><div class="bar w-1"></div>
          <div class="bar w-3"></div><div class="bar w-1"></div>
        </div>
        <span class="barcode-num">1010295</span>
      </div>

      <!-- 우측 플러스 버튼 -->
      <div class="plus-btn" title="Open Archive">+</div>

      <!-- 오른쪽 바코드 -->
      <div class="barcode-container">
        <div class="barcode">
          <div class="bar w-1"></div><div class="bar w-3"></div><div class="bar w-1"></div>
          <div class="bar w-2"></div><div class="bar w-1"></div><div class="bar w-3"></div>
          <div class="bar w-2"></div><div class="bar w-1"></div>
        </div>
        <span class="barcode-num">1010295</span>
      </div>
    </div>
  </footer>

  <!-- 4. INTERACTIVE JAVASCRIPT -->
  <script>
    // 마우스 위치에 따라 중앙 타이틀이 부드럽게 입체 반응하는 효과 (Tilt)
    const hero = document.getElementById('hero');

    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      
      hero.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // 마우스가 화면을 벗어나면 제자리로
    document.addEventListener('mouseleave', () => {
      hero.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    // 버튼 클릭 시 소리 또는 반응 (확장용)
    document.querySelectorAll('button, .pixel-box, .plus-btn').forEach(element => {
      element.addEventListener('click', () => {
        // 나중에 클릭 효과음(Sound Effect) 추가 가능!
        element.style.transform = 'scale(0.9)';
        setTimeout(() => element.style.transform = '', 100);
      });
    });
  </script>
</body>
</html>
