<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루룽찌 아카이브 💫</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --cover-bg: #fcebe1; /* 상단 따뜻한 베이지 커버 */
            --card-bg: #ffffff;
            --card-hover: #faf8f5;
            --text-main: #37352f;
            --text-sub: #787774;
            --border-color: #e9e9e8;
            
            /* 노션 스타일 태그 색상 */
            --tag-yellow: #fdecc8;
            --tag-yellow-text: #8f6300;
            --tag-pink: #ffe2dd;
            --tag-pink-text: #c04532;
            --tag-beige: #f1f0ef;
            --tag-beige-text: #5a5a5a;
            --tag-blue: #e0f2fe;
            --tag-blue-text: #0369a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        /* 1. 상단 커버 영역 */
        .cover {
            height: 180px;
            background-color: var(--cover-bg);
            width: 100%;
        }

        /* 2. 메인 컨테이너 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
        }

        /* 3. 프로필 아이콘 & 타이틀 */
        .header-icon {
            font-size: 52px;
            margin-top: -36px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
        }

        /* 콜아웃 상자 (노란색 팁 상자) */
        .callout {
            background-color: #fbf5e8;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: #4a4031;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        /* 카테고리 헤더 */
        .section-header {
            font-size: 18px;
            font-weight: 600;
            margin: 28px 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 4. 갤러리 카드 그리드 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--card-bg);
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            background: var(--card-hover);
        }

        .card-preview {
            height: 120px;
            background-color: #f7f6f3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-body {
            padding: 14px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* 태그 스타일 */
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .tag-yellow { background: var(--tag-yellow); color: var(--tag-yellow-text); }
        .tag-pink { background: var(--tag-pink); color: var(--tag-pink-text); }
        .tag-beige { background: var(--tag-beige); color: var(--tag-beige-text); }
        .tag-blue { background: var(--tag-blue); color: var(--tag-blue-text); }

        /* 구분선 */
        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 32px 0;
        }
    </style>
</head>
<body>

    <!-- 상단 뽀용 커버 -->
    <div class="cover"></div>

    <div class="container">
        <!-- 프로필 헤더 -->
        <div class="header-icon">💫</div>
        <h1 class="title">루룽찌</h1>
        <p class="subtitle">나의 캐릭터 & 세계관 아카이브 (っ' Modern ')っ</p>

        <!-- 안내 콜아웃 -->
        <div class="callout">
            💡 <span>태그 · B컷 · 서비스컷 등 이것저것 모아두는 공간입니다!</span>
        </div>

        <hr>

        <!-- 세션 1: 벨라토_VELATO -->
        <div class="section-header">
            <span>🔻 벨라토_VELATO</span>
        </div>
        
        <div class="card-grid">
            <!-- 캐릭터 카드 1 -->
            <div class="card">
                <div class="card-preview">🖼️</div>
                <div class="card-body">
                    <div class="card-title">네로 NERO</div>
                    <div class="tag-group">
                        <span class="tag tag-beige">벨라토_VELATO</span>
                        <span class="tag tag-pink">죄와 구원의 혼배성사</span>
                    </div>
                </div>
            </div>

            <!-- 캐릭터 카드 2 -->
            <div class="card">
                <div class="card-preview">🖼️</div>
                <div class="card-body">
                    <div class="card-title">리오 RIO</div>
                    <div class="tag-group">
                        <span class="tag tag-beige">벨라토_VELATO</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 세션 2: 묘연 -->
        <div class="section-header" style="margin-top: 40px;">
            <span>🔻 묘연</span>
        </div>

        <div class="card-grid">
            <!-- 캐릭터 카드 3 -->
            <div class="card">
                <div class="card-preview">☁️</div>
                <div class="card-body">
                    <div class="card-title">류온</div>
                    <div class="tag-group">
                        <span class="tag tag-yellow">비상 ! 전남친 긴급 관리 발령 ? !</span>
                        <span class="tag tag-pink">너의 눈물을 위해</span>
                        <span class="tag tag-beige">묘연</span>
                    </div>
                </div>
            </div>

            <!-- 캐릭터 카드 4 -->
            <div class="card">
                <div class="card-preview">🌧️</div>
                <div class="card-body">
                    <div class="card-title">남건우</div>
                    <div class="tag-group">
                        <span class="tag tag-beige">묘연</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
